name: Build

on:
  push:
    branches: [main]
    paths:
      - 'extensions/rembric/**'
      - 'docker/Dockerfile'
      - 'docker/.dockerignore'
      - 'docker/entrypoint.sh'
      - 'docker/entrypoint.test.mjs'
      - 'docker/self-update.patch'
      - 'docker/browser-panel.css'
      - 'docker/openchamber-licence.txt'
      - 'docker/check-image.mjs'
      - 'docker/releases*'
      - 'docker/latest*'
      - 'extensions/agent-browser/**'
      - '.github/workflows/build.yml'
  schedule:
    - cron: '17 * * * *'
    - cron: '37 4 * * 1'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Authorize only the initial 2.0.1 seed if an empty package cannot grant GHCR pull scope'
        type: boolean
        default: false
      release_id:
        description: 'Optional upstream release ID; empty catches up all eligible releases'
        type: string
        default: ''
      verify_digest:
        description: 'Read-only recovery: recorded push manifest digest; requires release_id and original source_commit'
        type: string
        default: ''
      source_commit:
        description: 'Original publishing commit for read-only verification recovery; never inferred from current main'
        type: string
        default: ''
      rebuild:
        description: 'Rebuild and republish an already-published release with the current Dockerfile; requires release_id'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '37 4 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, check and publish the browser-only package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./extensions/agent-browser/package.json").version')
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/openchamber-browser:$version-$GITHUB_SHA"
          docker build --target browser --tag "$image" \
            --build-context agent-browser=extensions/agent-browser \
            --build-arg "OPENCHAMBER_SOURCE_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" docker
          timeout 180 docker run --rm --interactive --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:exec,size=512m,mode=1777 --shm-size=512m \
            --env IMAGE_KIND=browser --entrypoint node "$image" --input-type=module < docker/check-image.mjs
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"

  plugin:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Test release discovery and latest promotion contracts
        run: node --test docker/releases.test.mjs docker/latest.test.mjs
      - name: Bundle the Rembric V2 plugin and check its export
        working-directory: extensions/rembric
        run: |
          bun build ./index.ts --target bun --format esm --outfile dist/rembric.js
          bun -e 'const {default:p}=await import("./dist/rembric.js"); if(p.id!=="rembric.lifecycle" || typeof p.setup!=="function") throw new Error("Invalid bundled plugin export")'
          cp NOTICE dist/
          cp THIRD_PARTY_LICENSES dist/
          (cd dist && sha256sum rembric.js > SHA256SUMS)
          bun -e 'await Bun.write("dist/build.json", JSON.stringify({repository:process.env.GITHUB_REPOSITORY,source_commit:process.env.GITHUB_SHA,bun:Bun.version,opencode_api:"2.0.24",entrypoint:"./index.ts",runtime:"self-contained",bundle_sha256:(await Bun.file("dist/SHA256SUMS").text()).split(" ")[0]},null,2)+"\n")'
      - name: Retain plugin bundle and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rembric-opencode-${{ github.sha }}
          path: extensions/rembric/dist/
          if-no-files-found: error
          retention-days: 30

  discover:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && !inputs.verify_digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      count: ${{ steps.releases.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release discovery and latest promotion contracts
        run: node --test docker/releases.test.mjs docker/latest.test.mjs
      - name: Discover every unbuilt eligible upstream release
        id: releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap || false }}
          RELEASE_ID: ${{ inputs.release_id || '' }}
          REBUILD: ${{ inputs.rebuild || false }}
          REBUILD_NEWEST: ${{ github.event_name == 'push' || github.event.schedule == '37 4 * * 1' }}
        run: node docker/releases.mjs discover

  image:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: openchamber-image-${{ matrix.release_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck release and canonical completion tag
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ matrix.version }}
          RELEASE_ID: ${{ matrix.release_id }}
          ASSET_SHA256: ${{ matrix.asset_sha256 }}
          BOOTSTRAP: ${{ matrix.bootstrap }}
          REBUILD: ${{ inputs.rebuild || github.event_name == 'push' || github.event.schedule == '37 4 * * 1' }}
        run: node docker/releases.mjs prepare
      - name: Build and check before publication
        if: steps.prepare.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
          ASSET_SHA256: ${{ steps.prepare.outputs.asset_sha256 }}
        run: |
          docker build --tag "$IMAGE" \
            --build-context agent-browser=extensions/agent-browser \
            --build-arg "OPENCHAMBER_VERSION=$VERSION" \
            --build-arg "OPENCHAMBER_ASSET_SHA256=$ASSET_SHA256" \
            --build-arg "OPENCHAMBER_SOURCE_REVISION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.openchamber.upstream.release-id=$RELEASE_ID" \
            --label "org.opencontainers.image.url=https://github.com/openchamber/openchamber/releases/tag/v$VERSION" docker
          docker image inspect "$IMAGE" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/image-labels.json"
          IMAGE_LABELS_FILE="$RUNNER_TEMP/image-labels.json" RELEASE_VERSION="$VERSION" SOURCE_COMMIT="$GITHUB_SHA" \
            node docker/releases.mjs verify-origin
          timeout 180 docker run --rm --interactive --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:exec,size=512m,mode=1777 --shm-size=512m \
            --env "EXPECTED_VERSION=$VERSION" --entrypoint node "$IMAGE" \
            --input-type=module < docker/check-image.mjs
      - name: Publish one canonical tag
        id: publish
        if: steps.prepare.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.prepare.outputs.image }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE" | tee "$RUNNER_TEMP/openchamber-push.log"
          digest=$(sed -nE 's/^[^[:space:]]+: digest: (sha256:[a-f0-9]{64}) size: [0-9]+$/\1/p' "$RUNNER_TEMP/openchamber-push.log")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Verify published manifest and package and repository privacy
        if: steps.prepare.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.prepare.outputs.image }}
          MANIFEST_DIGEST: ${{ steps.publish.outputs.digest }}
        run: node docker/releases.mjs verify-image
      - name: Verify the published image's build origin
        if: steps.prepare.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.prepare.outputs.image }}
          MANIFEST_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          reference="$IMAGE@$MANIFEST_DIGEST"
          docker pull "$reference"
          docker image inspect "$reference" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/image-labels.json"
          IMAGE_LABELS_FILE="$RUNNER_TEMP/image-labels.json" node docker/releases.mjs verify-origin

  latest:
    needs: [discover, image]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
          !inputs.bootstrap && !inputs.verify_digest && needs.discover.result == 'success' &&
          (needs.image.result == 'success' ||
           (needs.discover.outputs.count == '0' && needs.image.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: openchamber-latest
      cancel-in-progress: false
    outputs:
      outcome: ${{ steps.promote.outcome == 'failure' && (steps.promote.outputs.outcome || 'failed') || steps.promote.outputs.outcome || steps.candidate.outputs.outcome }}
      selected_release: ${{ steps.candidate.outputs.selected_release }}
      digest: ${{ steps.promote.outputs.digest || steps.candidate.outputs.digest }}
      previous_digest: ${{ steps.candidate.outputs.previous_digest }}
      publisher: ${{ steps.promote.outputs.publisher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the highest eligible stable release after acquiring the latest group
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node docker/latest.mjs candidate
      - name: Verify retained provenance and promote the exact registry bytes
        id: promote
        if: steps.candidate.outputs.outcome == 'ready'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LATEST_OUTCOME: ${{ steps.candidate.outputs.outcome }}
          LATEST_VERSION: ${{ steps.candidate.outputs.version }}
          LATEST_RELEASE_ID: ${{ steps.candidate.outputs.release_id }}
          LATEST_ASSET_SHA256: ${{ steps.candidate.outputs.asset_sha256 }}
          LATEST_PUBLISHED_AT: ${{ steps.candidate.outputs.published_at }}
          LATEST_DIGEST: ${{ steps.candidate.outputs.digest }}
          LATEST_PREVIOUS_DIGEST: ${{ steps.candidate.outputs.previous_digest }}
          LATEST_ALIAS_STATUS: ${{ steps.candidate.outputs.alias_status }}
        run: |
          auth_dir=''
          promotion_started=false
          finish() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$promotion_started" = false ]; then
              node docker/latest.mjs setup-failed || printf '%s\n' 'Failed to record promotion setup failure' >&2
            fi
            if [ -n "$auth_dir" ]; then rm -rf -- "$auth_dir"; fi
            exit "$status"
          }
          trap finish EXIT
          auth_dir=$(mktemp -d "$RUNNER_TEMP/openchamber-latest-auth.XXXXXX")
          export DOCKER_CONFIG="$auth_dir"
          printf '%s' "$GITHUB_TOKEN" | timeout --kill-after 5 30 docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          promotion_started=true
          node docker/latest.mjs promote

  verification:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reconcile a published tag without building or overwriting it
        id: published
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          MANIFEST_DIGEST: ${{ inputs.verify_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: node docker/releases.mjs verify-release
      - name: Verify the exact published config without starting it
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.published.outputs.image }}
          MANIFEST_DIGEST: ${{ steps.published.outputs.digest }}
          RELEASE_VERSION: ${{ steps.published.outputs.version }}
          RELEASE_ID: ${{ steps.published.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.published.outputs.source_commit }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          reference="$IMAGE@$MANIFEST_DIGEST"
          docker pull "$reference"
          docker image inspect "$reference" --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/image-labels.json"
          IMAGE_LABELS_FILE="$RUNNER_TEMP/image-labels.json" node docker/releases.mjs verify-origin
