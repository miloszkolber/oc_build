name: Inspect initial package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Inspect package schema and independently reconcile initial push digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { ReleaseClient } from './scripts/upstream-releases.mjs';
          const client = new ReleaseClient({ token: process.env.GITHUB_TOKEN, actor: process.env.GITHUB_ACTOR });
          const packageResponse = await client.github('/users/miloszkolber/packages/container/openchamber');
          assert(packageResponse.ok, `Package metadata HTTP ${packageResponse.status}`);
          const pkg = await packageResponse.json();
          console.log(JSON.stringify({ name: pkg.name, type: pkg.package_type, visibility: pkg.visibility,
            repositoryKeys: Object.keys(pkg.repository || {}), repositoryFullName: pkg.repository?.full_name,
            repositoryPrivate: pkg.repository?.private }, null, 2));
          const repoResponse = await client.github('/repos/miloszkolber/openchamber');
          assert(repoResponse.ok, `Repository metadata HTTP ${repoResponse.status}`);
          const repo = await repoResponse.json();
          console.log(JSON.stringify({ full_name: repo.full_name, private: repo.private }));
          assert.equal(pkg.visibility, 'private');
          assert.equal(repo.private, true);
          const token = await client.registryToken();
          for (const [version, release_id, expected] of [
            ['2.0.1', '395994070', 'sha256:c236251752ae03e61b0f06a4acf5d9433b5d66eae247452018db53b28d257365'],
            ['2.0.2', '397002711', 'sha256:89e3d685d3e13fca1ce2220a431cbdaad0fe8b680678aad6258202690e3aff9b'],
          ]) {
            const digest = await client.manifestDigest({ version, release_id }, token);
            assert.equal(digest, expected, 'Remote manifest must match the recorded successful initial push');
            console.log(JSON.stringify({ version, release_id, digest }));
          }
          NODE
