name: Sandbox image
on:
  push:
    branches: [main]
    paths: ['docker/sandbox/**', '.github/workflows/sandbox.yml']
  pull_request:
    paths: ['docker/sandbox/**', '.github/workflows/sandbox.yml']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, check and publish the agent sandbox image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY_OWNER/openchamber-sandbox:sha-$GITHUB_SHA"
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" docker/sandbox
          docker run --rm --network none --entrypoint bash "$image" \
            /usr/local/share/sandbox/check-image.sh
          docker run --rm --network none --volume "$PWD:/repo" --workdir /repo \
            --entrypoint bun "$image" test scripts/check-docs.test.mjs
          docker run --rm --network none --volume "$PWD:/repo" --workdir /repo \
            --entrypoint node "$image" scripts/check-docs.mjs
          docker run --rm --network none --volume "$PWD:/repo" --workdir /repo \
            --env OPENSPEC_TELEMETRY=0 --entrypoint openspec "$image" validate --all --strict
          if [ "${{ github.event_name }}" = pull_request ]; then exit 0; fi
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          latest="ghcr.io/$GITHUB_REPOSITORY_OWNER/openchamber-sandbox:latest"
          docker tag "$image" "$latest"
          docker push "$latest"
