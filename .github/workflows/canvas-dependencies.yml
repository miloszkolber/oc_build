name: Canvas dependencies
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned dependency versions
        working-directory: extensions/canvas
        run: |
          node --version
          node scripts/check-deps.mjs | tee "$RUNNER_TEMP/report.txt"
      - name: Open or update the tracking issue
        if: contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q '^UPDATE' "$RUNNER_TEMP/report.txt" || { echo 'No drift.'; exit 0; }
          title='Canvas dependencies need an update'
          body=$(printf 'The scheduled Canvas dependency check found newer releases.\n\n```\n%s\n```\n\nUpdate `extensions/canvas/package.json`, run `bun install`, `bun test` and `bun run package`, then close this issue.\n' "$(cat "$RUNNER_TEMP/report.txt")")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
