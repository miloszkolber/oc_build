name: Canvas extension
on:
  push:
    branches: [main]
    paths: ['extensions/canvas/**', '.github/workflows/canvas.yml']
  pull_request:
    paths: ['extensions/canvas/**', '.github/workflows/canvas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/canvas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run package
      - run: bun scripts/validate.mjs dist/examples/cost-explorer.canvas.json
      - run: bun scripts/validate.mjs dist/examples/showcase.canvas.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openchamber-generative-canvas
          path: extensions/canvas/dist/openchamber-generative-canvas-*.zip
