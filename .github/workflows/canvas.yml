name: Canvas extension
on:
  push:
    branches: [main]
    paths: ['extensions/canvas/**', '.github/workflows/canvas.yml']
  pull_request:
    paths: ['extensions/canvas/**', '.github/workflows/canvas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run package
      - run: bun scripts/validate.mjs dist/examples/cost-explorer.canvas.json
      - run: bun scripts/validate.mjs dist/examples/revenue-pulse.canvas.json
      - run: bun scripts/validate.mjs dist/examples/showcase.canvas.json
      - uses: actions/upload-artifact@v4
        with:
          name: openchamber-generative-canvas
          path: extensions/canvas/dist/openchamber-generative-canvas-*.zip
