name: Canvas extension
on:
  push:
    branches: [main]
    paths: ['extensions/canvas/**', '.github/workflows/canvas.yml']
  pull_request:
    paths: ['extensions/canvas/**', '.github/workflows/canvas.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/canvas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run package
      - name: Validate every emitted example
        run: for file in dist/examples/*.canvas.json; do bun scripts/validate.mjs "$file"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchamber-generative-canvas
          path: extensions/canvas/dist/openchamber-generative-canvas-*.zip
