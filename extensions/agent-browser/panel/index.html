<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Browser controls</title>
    <style>
      :root { color-scheme: light dark; font-family: var(--oc-font, ui-sans-serif, system-ui, sans-serif); }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      button, input, select { font: inherit; }
      /* Rows: page tabs, address row, bottom bar. The console grows below when open. */
      #root { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: 28px 40px 34px; padding: 4px 8px; background: var(--oc-bg, transparent); color: var(--oc-fg, inherit); }
      #root.console-open { grid-template-rows: 28px 40px 34px minmax(0, 1fr); }
      .row { display: flex; align-items: center; min-width: 0; }
      /* The status takes the free space, so the controls sit at the right edge. */
      .status { display: flex; flex: 1 1 0%; min-width: 0; align-items: center; gap: 6px; overflow: hidden; color: var(--oc-muted, currentColor); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .chat-button { flex: 0 0 auto; height: 22px; padding: 0 10px; border: 1px solid var(--oc-border, currentColor); border-radius: 999px; background: transparent; color: var(--oc-fg, inherit); font-size: 11px; white-space: nowrap; cursor: pointer; }
      .chat-button[hidden] { display: none; }
      .chat-button:hover:not(:disabled) { background: var(--oc-hover, transparent); }
      .status::before { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--oc-muted, currentColor); content: ""; opacity: .65; }
      .status[data-state="ready"]::before { background: var(--oc-success, var(--oc-muted, currentColor)); }
      .status[data-state="user"]::before { background: var(--oc-primary, var(--oc-focus, currentColor)); opacity: 1; }
      .status[data-state="agent"]::before, .status[data-state="waiting"]::before { background: var(--oc-warning, var(--oc-muted, currentColor)); opacity: 1; }
      .status[data-state="error"]::before { background: var(--oc-error, currentColor); opacity: 1; }
      .page-tabs-row { gap: 4px; }
      .page-tabs { flex: 1; min-width: 0; }
      .page-tabs .oc-sdk-tabs { display: flex; width: 100%; height: 28px; gap: 2px; padding: 0; border-radius: 0; background: transparent; }
      .page-tabs .oc-sdk-tab { position: relative; flex: 0 1 180px; min-width: 72px; height: 28px; padding: 0 10px; }
      .page-tabs .oc-sdk-tab span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      /* Close lives on the active pill, not beside "+". */
      .page-tabs .oc-sdk-tab:has(> .close-tab) { padding-right: 24px; }
      .close-tab, .new-tab { display: inline-flex; width: 20px; height: 20px; flex: 0 0 20px; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: var(--oc-radius, 6px); background: transparent; color: var(--oc-muted, currentColor); cursor: pointer; }
      .page-tabs .oc-sdk-tab > .close-tab { position: absolute; top: 50%; right: 4px; width: 16px; height: 16px; flex: 0 0 16px; transform: translateY(-50%); }
      .close-tab:hover:not(:disabled), .new-tab:hover:not(:disabled) { background: var(--oc-active, var(--oc-hover, transparent)); color: var(--oc-fg, inherit); opacity: 1; }
      .close-tab svg, .new-tab svg { width: 12px; height: 12px; pointer-events: none; }
      .navigation-row { gap: 2px; }
      .page-tools { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
      .navigation-row button, input { color: inherit; }
      .navigation-row button { display: inline-flex; width: 28px; height: 28px; flex: 0 0 28px; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: var(--oc-radius, 6px); background: transparent; color: var(--oc-muted, currentColor); cursor: pointer; }
      .navigation-row button:hover:not(:disabled) { background: var(--oc-hover, transparent); color: var(--oc-fg, inherit); }
      .navigation-row button:active:not(:disabled) { background: var(--oc-active, var(--oc-hover, transparent)); }
      .navigation-row .select-compatibility[aria-pressed="true"], .navigation-row .mobile-toggle[aria-pressed="true"] { background: var(--oc-selection, var(--oc-hover, transparent)); color: var(--oc-selection-fg, var(--oc-fg, inherit)); }
      .navigation-row button svg { width: 16px; height: 16px; pointer-events: none; }
      button:disabled, input:disabled, select:disabled, fieldset:disabled button { cursor: default; opacity: .55; }
      input { height: 28px; min-width: 0; flex: 1; margin-left: 4px; padding: 0 12px; border: 1px solid var(--oc-border, currentColor); border-radius: 999px; background: var(--oc-elevated, transparent); color: var(--oc-elevated-fg, var(--oc-fg, inherit)); font-size: 12px; }
      input::placeholder { color: var(--oc-muted, currentColor); opacity: .8; }
      /* Bottom bar: control status, device/resolution control, hand-back. */
      .dock-bar { gap: 8px; border-top: 1px solid var(--oc-subtle, var(--oc-border, currentColor)); padding-top: 3px; }
      .viewport-control { display: flex; align-items: center; gap: 4px; flex: 0 1 auto; min-width: 0; }
      .viewport-select { flex: 0 1 150px; min-width: 64px; height: 26px; padding: 0 6px; border: 1px solid var(--oc-border, currentColor); border-radius: var(--oc-radius, 6px); background: var(--oc-elevated, transparent); color: var(--oc-elevated-fg, var(--oc-fg, inherit)); font-size: 12px; }
      .viewport-select[hidden] { display: none; }
      .hand-back { flex: 0 0 auto; height: 26px; padding: 0 10px; border: 1px solid var(--oc-border, currentColor); border-radius: 999px; background: transparent; color: var(--oc-fg, inherit); font-size: 11px; white-space: nowrap; cursor: pointer; }
      .hand-back[hidden] { display: none; }
      .hand-back:hover:not(:disabled) { background: var(--oc-hover, transparent); }
      .custom-size { display: flex; flex: 0 1 auto; min-width: 0; align-items: center; gap: 4px; }
      .custom-size[hidden] { display: none; }
      .custom-size input { flex: 0 1 72px; height: 26px; margin-left: 0; padding: 0 8px; }
      .custom-size span { color: var(--oc-muted, currentColor); font-size: 12px; }
      .custom-size button { display: inline-flex; width: 26px; height: 26px; flex: 0 0 26px; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: var(--oc-radius, 6px); background: transparent; color: var(--oc-muted, currentColor); cursor: pointer; }
      .custom-size button:hover:not(:disabled) { background: var(--oc-hover, transparent); color: var(--oc-fg, inherit); }
      .custom-size button svg { width: 16px; height: 16px; pointer-events: none; }
      .navigation-row .problems { display: inline-flex; width: auto; flex: 0 0 auto; height: 22px; align-items: center; gap: 6px; margin-left: 4px; padding: 0 8px; border-radius: 999px; background: var(--oc-hover, transparent); color: inherit; font-size: 11px; font-variant-numeric: tabular-nums; }
      .navigation-row .problems[aria-expanded="true"] { background: var(--oc-selection, var(--oc-hover, transparent)); }
      .navigation-row .problems[hidden], .problems span:empty { display: none; }
      .problem-errors { color: var(--oc-error-text, var(--oc-error, currentColor)); }
      .problem-warnings { color: var(--oc-warning-text, var(--oc-warning, currentColor)); }
      .console { display: flex; min-width: 0; min-height: 0; flex-direction: column; border-top: 1px solid var(--oc-subtle, var(--oc-border, currentColor)); }
      .console[hidden] { display: none; }
      .console-header { margin: 0; padding: 4px 4px 2px; overflow: hidden; color: var(--oc-muted, currentColor); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
      .console-list { flex: 1; min-height: 0; margin: 0; padding: 0; overflow: auto; list-style: none; font: 11px/18px var(--oc-mono, ui-monospace, monospace); }
      .console-row, .console-empty { display: flex; gap: 8px; padding: 1px 4px; border-bottom: 1px solid var(--oc-subtle, transparent); }
      .console-empty { color: var(--oc-muted, currentColor); }
      .console-level { flex: 0 0 52px; }
      .console-row[data-level="error"] .console-level { color: var(--oc-error-text, var(--oc-error, currentColor)); }
      .console-row[data-level="warning"] .console-level { color: var(--oc-warning-text, var(--oc-warning, currentColor)); }
      .console-message { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .console-source { flex: 0 1 auto; max-width: 30%; overflow: hidden; color: var(--oc-muted, currentColor); text-overflow: ellipsis; white-space: nowrap; }
      input:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--oc-focus, currentColor); outline-offset: 1px; }
      .console-list:focus-visible { outline: 2px solid var(--oc-focus, currentColor); outline-offset: -2px; }
      @media (max-width: 560px) {
        #root { grid-template-rows: 28px 68px 34px; }
        #root.console-open { grid-template-rows: 28px 68px 34px minmax(0, 1fr); }
        .navigation-row { display: grid; grid-template-columns: 28px 28px 28px minmax(0, 1fr); grid-template-rows: 34px 34px; }
        .navigation-row .address { width: 100%; margin-left: 0; }
        .navigation-row .page-tools { grid-column: 1 / -1; justify-content: flex-end; }
        .viewport-select { flex: 1 1 auto; min-width: 0; }
      }
      @media (forced-colors: active) {
        .status::before, .page-tabs .oc-sdk-tab[aria-selected="true"], .select-compatibility[aria-pressed="true"], .mobile-toggle[aria-pressed="true"], .problems[aria-expanded="true"] { forced-color-adjust: none; background: Highlight; color: HighlightText; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
